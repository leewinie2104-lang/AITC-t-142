# Production stack on one Lightsail small_3_0 (2 GB RAM) — ADR-0012.
#
# Never run this by hand from a release folder: deploy.py calls
#   docker compose -p parksmart --project-directory /opt/parksmart \
#     --env-file /opt/parksmart/.env --env-file /opt/parksmart/deploy.env \
#     -f /opt/parksmart/releases/<tag>/docker-compose.prod.yml ...
# so volumes, the .env and the project name stay the same across releases.
#
# /opt/parksmart/.env    : app secrets + POSTGRES_PASSWORD + SITE_ADDRESS (filled by hand, chmod 600)
# /opt/parksmart/deploy.env : IMAGE (registry/repo:tag) and RELEASE_DIR, written by deploy.py
# Workers start only with COMPOSE_PROFILES=workers in .env (once arq is in server/requirements.txt).
# Memory limits add up to ~1.6 GB, leaving room for the OS; 2 GB of swap is set by cloud-init.

x-server: &server
  image: ${IMAGE:?IMAGE is set by deploy.py}
  env_file:
    - .env
  environment:
    APP_ENV: production
    DATABASE_URL: postgresql://parksmart:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/parksmart
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  caddy:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env, e.g. 1-2-3-4.sslip.io}
    volumes:
      - ${RELEASE_DIR:?RELEASE_DIR is set by deploy.py}/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 64m
    restart: unless-stopped
    logging: *logging

  api:
    <<: *server
    # No published port: only caddy reaches it on the compose network.
    mem_limit: 512m

  worker:
    <<: *server
    profiles: ["workers"]
    command: ["arq", "app.main_worker.BgWorkerSettings"]
    healthcheck:
      disable: true   # the image HEALTHCHECK probes the api port
    mem_limit: 256m

  agent-worker:
    <<: *server
    profiles: ["workers"]
    command: ["arq", "app.main_worker.AgentWorkerSettings"]
    healthcheck:
      disable: true
    mem_limit: 384m

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redisdata:/data
    mem_limit: 128m
    restart: unless-stopped
    logging: *logging

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: parksmart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: parksmart
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parksmart -d parksmart"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 128m
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  redisdata:
  caddy-data:
  caddy-config:
