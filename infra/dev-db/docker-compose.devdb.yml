# Shared DEV Postgres + Redis on the CI EC2 `parksmart-ci-runner` (plan 017, ADR-0013). Not for demo/prod.
# Reached over Tailscale only: the security group has no inbound rule, so ports bound here are not public.
# Ports 15432 / 16379 avoid the CI `docker` job, which starts the repo compose (postgres on 5432).
# Passwords live in .env next to this file on the box (chmod 600, generated by setup.py, never committed).
name: parksmart-devdb

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped   # the weekly `docker system prune -af` removes stopped containers
    env_file: .env            # POSTGRES_PASSWORD, MIGRATOR_PASSWORD, APP_PASSWORD
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=100", "-c", "work_mem=4MB"]
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m           # 2 GB box shared with CI jobs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 6

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: .env            # REDIS_PASSWORD
    # noeviction: arq must never lose queued jobs silently.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory 64mb --maxmemory-policy noeviction --appendonly yes"]
    ports:
      - "16379:6379"
    volumes:
      - redisdata:/data
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      retries: 6

volumes:
  pgdata:
  redisdata:
