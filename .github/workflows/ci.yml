name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel an older run of the same PR/branch when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check (lint + typecheck + test)
    runs-on: [self-hosted, team-142]  # team runner on EC2 (ADR-0012)

    env:
      APP_ENV: test
      LLM_API_KEY: test-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: make install

      # Same command devs run locally; the steps live in the Makefile.
      - name: make check
        run: make check

  docker:
    name: docker build + health check
    runs-on: [self-hosted, team-142]  # team runner on EC2 (ADR-0012)

    steps:
      - uses: actions/checkout@v4

      # Compose requires .env; CI only needs the placeholders from .env.example.
      - name: Create .env from .env.example
        run: make .env

      - name: Build image
        run: docker compose --profile app build

      # --wait blocks until the api HEALTHCHECK (/api/v1/health) reports healthy, or fails the job.
      - name: Start api and wait for health
        run: docker compose --profile app up -d --wait --wait-timeout 120 api

      - name: Show logs on failure
        if: failure()
        run: docker compose --profile app logs api

      - name: Tear down
        if: always()
        run: docker compose --profile app down -v

  # Only CI migrates the shared dev DB (plan 017, ADR-0013): after a merge to dev, on the box that hosts it.
  migrate-dev-db:
    name: migrate shared dev DB
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: check
    runs-on: [self-hosted, team-142]
    concurrency:
      group: dev-db
      cancel-in-progress: false   # never cut a migration in half

    # MIGRATE_DATABASE_URL comes from the runner's own env file on this box (/home/runner/actions-runner/.env,
    # written by infra/dev-db/setup.py), not from a GitHub secret. Do not set it here: job env would override it.
    env:
      MIGRATE_ROLE: parksmart_owner

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: make install

      # The `env` expression context does not see the runner's process env, so check in the shell.
      - name: alembic upgrade head
        working-directory: server
        run: |
          if [ -z "${MIGRATE_DATABASE_URL:-}" ]; then
            echo "::warning::MIGRATE_DATABASE_URL missing from the runner env (run infra/dev-db/setup.py); dev DB not migrated"
            exit 0
          fi
          alembic upgrade head && alembic current
