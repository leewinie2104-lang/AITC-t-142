name: Client

# Type-check and build the React SPA (client/) so a broken frontend cannot reach dev/main (SCRUM-205, plan 026).
# Runs only when the client or this workflow changes; server-only PRs skip it.
on:
  push:
    branches: [main, dev]
    paths: ["client/**", ".github/workflows/client.yml"]
  pull_request:
    branches: [main, dev]
    paths: ["client/**", ".github/workflows/client.yml"]

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: client build (tsc + vite)
    runs-on: [self-hosted, team-142]  # team runner on EC2 (ADR-0012)

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      # pnpm first, so setup-node can find it for the store cache. Major 9 matches lockfileVersion 9.0.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      # --frozen-lockfile fails when package.json and pnpm-lock.yaml disagree instead of rewriting the lockfile.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # "build" = tsc -b && vite build, so type errors fail here too.
      - name: Build
        run: pnpm build
